name: refresh-availability

# On-demand availability collection. Dispatched by the GPU Where jobs Worker
# (`make run-job JOB=availability`) or from the Actions tab. The jobs Worker owns
# the optional schedule; this workflow has no schedule of its own.
on:
  workflow_dispatch:

permissions:
  contents: write

# One writer at a time. Shared with refresh-pricing so the two bot commits to
# main queue instead of racing (the daily tick dispatches both a second apart).
concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Full history: the commit step rebases over a moved main when a push loses a race.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: pip install -r requirements.txt
      - name: Collect free GPUs (providers with a public signal)
        env:
          JL_API_KEY: ${{ secrets.JL_API_KEY }}
        run: python scrapers/availability_refresh.py --write
      - name: Freshness gate for availability
        run: python scripts/check_freshness.py --warn-only
      - name: Commit observations
        id: commit
        run: scripts/bot_commit_push.sh "availability $(date -u +%FT%H:%MZ)" data
      - name: Publish to Cloudflare Pages
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PROJECT: gpuwhere
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; data is committed but the site is not redeployed."
            exit 0
          fi
          make deploy
