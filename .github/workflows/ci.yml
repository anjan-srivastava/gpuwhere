name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install jsonschema
      - name: Schema validation
        run: make validate
      - name: Build the published artifact
        run: make build
      - name: Tests (data contract, scrapers, API, edge worker, HTTP surface)
        run: make test
      - name: Freshness (informational on PRs)
        run: python scripts/check_freshness.py --warn-only
