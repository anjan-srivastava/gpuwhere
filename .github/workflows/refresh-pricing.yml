name: refresh-pricing

# On-demand pricing refresh. Dispatched by the GPU Where jobs Worker
# (`make run-job JOB=pricing`) or from the Actions tab. The jobs Worker owns the
# optional schedule; this workflow has no schedule of its own.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-pricing
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Scrape official sources
        run: python scrapers/pricing_refresh.py --write --retire-superseded
      - name: Validate before committing
        run: make validate
      - name: Tests before committing
        run: make test
      - name: Commit changes
        id: commit
        run: |
          git config user.name  "catalogue-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "pricing refresh $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to Cloudflare Pages
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PROJECT: gpuwhere
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; data is committed but the site is not redeployed."
            exit 0
          fi
          make deploy
