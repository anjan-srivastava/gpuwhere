name: refresh-pricing

# On-demand pricing refresh. Dispatched by the GPU Where jobs Worker
# (`make run-job JOB=pricing`) or from the Actions tab. The jobs Worker owns the
# optional schedule; this workflow has no schedule of its own.
on:
  workflow_dispatch:

permissions:
  contents: write

# One writer at a time. refresh-pricing and refresh-availability both commit to
# main, and the daily tick dispatches them a second apart; sharing this group
# makes them queue so neither checks out a commit the other is about to replace.
concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Start from the head of main, not the sha the dispatch was recorded against:
      # a queued run would otherwise begin from a tree the previous run replaced.
      # Full history lets the commit step rebase if main still moves mid-run.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install -r requirements.txt
      - name: Scrape official sources
        env:
          JL_API_KEY: ${{ secrets.JL_API_KEY }}
        run: python scrapers/pricing_refresh.py --write --retire-superseded
      - name: Validate before committing
        run: make validate
      - name: Tests before committing
        run: make test
      - name: Commit changes
        id: commit
        run: scripts/bot_commit_push.sh "pricing refresh $(date -u +%F)" data reports
      - name: Publish to Cloudflare Pages
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PROJECT: gpuwhere
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; data is committed but the site is not redeployed."
            exit 0
          fi
          make deploy
